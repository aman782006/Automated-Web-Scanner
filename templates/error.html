{% extends "base.html" %}
{% block title %}{{ code }} — Error{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-muted opacity-25 mb-2">{{ code }}</div>
    <h2 class="fw-bold mb-3">
      <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>{{ message }}
    </h2>
    {% if description %}
    <p class="text-muted mb-4">{{ description }}</p>
    {% endif %}
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-house-fill me-2"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
